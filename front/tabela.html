<!DOCTYPE html>
<html lang="pt-br">
    <head> 
        <meta charset="utf-8"/>
        <title> Prática de Tabelas </title>
    </head>
<!-- Comentário -->
    <body> 
        <h1>Tabela</h1>

        <h2>Tabela de Nomes e idades</h2>
        <table> <!-- table é a Tabela-->
            <tr><th>Nome</th> <th>Idade</th></tr> <!-- tr é a linha --> <!-- th é o cabeçalho da coluna-->
            <tr><td>Gustavo</td> <td>22</td></tr>
            <tr><td>Gislaine</td> <td>22</td></tr>
            <tr><td>Gustavo</td> <td>19</td></tr>
            <tr><td>Caroline</td> <td>19</td></tr>
            <tr><td>Sara</td> <td>19</td></tr>
        </table>

            <h2> Segunda Tabela</h2>

        <table border="3">
            <tr><th> Coluna A </th> <th> Coluna B </th> <th> Coluna C </th></tr>
            <tr><td rowspan="2"> Célula 1 </td> <td> Célula 2 </td> <td> Célula 3 </td></tr> <!--rowspan é mesclagem de linhas-->
            <tr> <td> Célula 4 </td> <td> Célula 5 </td> </tr>
            <tr> <td colspan="3"> Célula 6 </td></tr> <!-- colspan mesclagem de colunas-->
            <caption> Tabela com Mesclagem </caption> <!-- Legenda da tabela-->
        </table>
    </body>
</html>
