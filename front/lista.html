<!DOCTYPE html>
<html lang="pt-br">
    <head> 
        <meta charset="utf-8"/>
        <title> Teste de Listas </title>
    </head>
<!-- Comentário -->
    <body> 
        <h1> Listas </h1>

        <ul> <!-- ul para Listas não ordenadas -->
            <li> Manhã </li> <!-- li é item da lista-->

            <li> Tarde </li>
                <ol> <!-- ol para criar listas ordenadas-->
                    <li> Estudar segurança </li>
                        <ol type="i" start="5" reversed>
                            <li> Estudar os 8 domínios da segurança</li>
                            <li> Estudar a diferença de PII e SPII</li>
                            <li> Estudar tipos de Malware </li>
                            <li> Conhecer padrões do NIST</li>
                        </ol>
                    <li> Programar em Python</li>
                    <li> Estudar matemática </li>
                    <li> Descansar </li>
                </ol>

            <li> Noite </li>

        </ul>

    </body>
</html>
