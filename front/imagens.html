<!DOCTYPE html>
<html lang="pt-br">
    <head> 
        <meta charset="utf-8"/>
        <title> Teste de Imagens </title>
    </head>
<!-- Comentário -->
    <body> 
        <h1> Imagem </h1>

            <figure> <!-- Cria uma borda invisível ao redor da imagem-->
            <img src="pics/pexels-code.jpg"
            alt="Fotografia de um código escrito num computador"
            height="300">
            <!-- alt é um texto alternativo caso a imagem não carregue-->
            <!-- height ou width escolher um dos dois para ser usado para dimensionar o tamanho-->

                <figcaption> Fotografia de um código </figcaption> <!-- Uma legenda para imagem-->
            </figure>

    </body>
</html>
