<!DOCTYPE html>
<html lang="pt-br">
    <head> 
        <meta charset="utf-8"/>
        <title> Contato </title>
        <script src="js/script.js" defer> </script>
    </head>
    <body> 
        <header>
            <a href="index.html"> Ínicio </a> <a href="cardapio.html"> Cardápio </a> <a href="galeria.html"> Galeria </a> <a href="contato.html"> Contato </a> <a href="sobre.html"> Sobre </a>
        </header>
        <main>
            <form>
                <fieldset>
                    <label> Nome </label>
                    <input type="text" size="25" id="nome">
                    <br>
                    <label> E-mail </label>
                    <input type="email" size="25" id="email">
                    <br>
                    <label> Telefone </label>
                    <input type="tel" placeholder="(xx) xxxxx-xxxx" size="25" id="telefone">
                    <br>
                    <label>Mensagem</label>
                    <textarea rows="5" cols="25"> </textarea>
                    <br>
                    <label>Para qual dia será sua reserva?</label>
                    <select>
                        <option> Segunda-feira </option>
                        <option> Terça-feira </option>
                        <option> Quarta-feira </option>
                        <option> Quinta-feira </option>
                        <option> Sexta-feira </option>
                    </select>
                    <br>
                    <input type="submit" value="Enviar Reserva" id="botao">
                </fieldset>
            </form>
        </main>
    </body>
</html>
